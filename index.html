<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Typing Speed Test</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <span class="a1">TYPING SPEED TEST</span>
        <div class="d1">
        <div class="set-time">
            <p>Choose time:</p>
            <select>
                <option value="15">15 sec</option>
                <option value="30">30 sec</option>
                <option value="60">60 sec</option>

            </select>
        

         <div class="stats">
            <div>Time left:</div>

         </div>

        </div>
        <div class="typing-box"></div>
        <input type="text" class="mobile-input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

        <div class="results">
            <div class="p1">Performance summary</div>
            <div class="item1">
                <span class="s1">WPM:</span>
                
            </div>
            <div class="item2">
                <span class="s2">CPM:</span>
            </div>
            <div class="item3">
                <span class="s3">Accuracy:</span>
            </div>
            <div class="item4">
                <span class="s4">Your typing persona:</span>
            </div>
        </div>

        <button id="restart">Restart</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
